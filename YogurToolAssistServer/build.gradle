plugins {
    id 'java'
}

group = 'dev.yogur'
version = project.plugin_version

repositories { maven { url = uri('https://repo.papermc.io/repository/maven-public/') } }
dependencies { compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT' }

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

processResources {
    inputs.property 'version', project.version
    filesMatching('plugin.yml') { expand version: project.version }
}
