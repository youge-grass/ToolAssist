plugins { id 'net.fabricmc.fabric-loom' }
version = mod_version
group = maven_group
base { archivesName = "${archives_base_name}-${minecraft_version}" }
repositories {
    mavenCentral()
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // Optional API only; ModMenu 21 does not declare 26.4 runtime support.
    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = java_version as int
    options.encoding = 'UTF-8'
}
processResources {
    def properties = [version: project.version, minecraft_version: minecraft_version,
        loader_version: loader_version, java_version: java_version, fabric_api_version: fabric_api_version]
    inputs.properties(properties)
    filesMatching('fabric.mod.json') { expand(properties) }
}
jar {
    manifest.attributes('Minecraft-Version': minecraft_version, 'Implementation-Version': project.version,
        'ModMenu-Compatibility': 'compile-only; runtime unverified')
}
